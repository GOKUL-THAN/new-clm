services:
  - type: web
    name: clm-api
    runtime: go
    plan: free
    region: oregon
    buildCommand: go build -o bin/clm-api ./cmd/api
    startCommand: ./bin/clm-api
    envVars:
      - key: PORT
        value: 10000
      - key: CLM_DATABASE_URL
        value: clm.db
      - key: CLM_LOG_LEVEL
        value: info
